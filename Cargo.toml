[package]
name = "flowsta-hc-lines"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Run two Holochain lines side by side in a desktop app and move a person's data from the old line to the new one"
repository = "https://github.com/WeAreFlowsta/flowsta-hc-lines"
readme = "README.md"
keywords = ["holochain", "conductor", "lair", "migration"]
publish = false

[features]
default = ["line-06", "line-07"]
# Each Holochain line is a feature that pins the exact client crate versions
# its conductor needs.
line-06 = ["dep:holochain_client_06", "dep:holochain_types_06", "dep:holochain_conductor_api_06", "dep:lair_keystore_api_06", "dep:mr_bundle_06"]
line-07 = ["dep:holochain_client_07", "dep:holochain_types_07", "dep:holochain_conductor_api_07", "dep:lair_keystore_api_07", "dep:mr_bundle_07"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
thiserror = "1.0"
log = "0.4"
sysinfo = "0.33"
tokio = { version = "1", features = ["time", "net", "rt"] }
async-trait = "0.1"
url = "2.5"
getrandom = "0.2"
percent-encoding = "2.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Holochain 0.6.1: conductor client 0.8.1, lair 0.6.3.
holochain_client_06 = { package = "holochain_client", version = "=0.8.1", default-features = false, optional = true }
holochain_types_06 = { package = "holochain_types", version = "=0.6.1", optional = true }
# The conductor's wire errors, to classify zome call failures by variant.
holochain_conductor_api_06 = { package = "holochain_conductor_api", version = "=0.6.1", optional = true }
lair_keystore_api_06 = { package = "lair_keystore_api", version = "=0.6.3", optional = true }
mr_bundle_06 = { package = "mr_bundle", version = "=0.6.1", optional = true }
# Holochain 0.7.1: conductor client 0.9.1, lair 0.7.1.
holochain_client_07 = { package = "holochain_client", version = "=0.9.1", default-features = false, optional = true }
holochain_types_07 = { package = "holochain_types", version = "=0.7.1", optional = true }
holochain_conductor_api_07 = { package = "holochain_conductor_api", version = "=0.7.1", optional = true }
lair_keystore_api_07 = { package = "lair_keystore_api", version = "=0.7.1", optional = true }
mr_bundle_07 = { package = "mr_bundle", version = "=0.7.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: sidecars spawned through CreateProcessW with their console created
# hidden, tied to a kill-on-close Job Object, with a window sweep as the
# second line (src/process.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
